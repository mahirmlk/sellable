[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "sellable-commerce"
version = "0.1.0"
description = "Safety-first commerce core for AI buyers and merchants."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "cryptography>=42,<47",
    "fastapi>=0.115,<1.0",
    "langgraph>=0.2,<1.0",
    "psycopg[binary]>=3.1,<4.0",
    "pydantic>=2.8,<3.0",
    "python-dotenv>=1.0,<2.0",
    "PyJWT>=2.9,<3.0",
    "razorpay>=1.4,<2.0",
    # razorpay 1.4.x imports pkg_resources at import time. Runtime
    # environments no longer preinstall setuptools (CI, slim images), and
    # setuptools >=81 removed pkg_resources entirely — so pin a version
    # that still ships it or every sellable import fails.
    "setuptools>=75,<81",
    "slowapi>=0.1.9,<1.0",
    "SQLAlchemy>=2.0,<3.0",
    "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1.0",
    "pytest>=8.0,<9.0",
]
postgres = [
    "psycopg[binary]>=3.1,<4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["services/commerce", "."]
# "." keeps the single canonical top-level `agents/` package importable under
# pytest. There must be exactly one `agents` tree (see CI single-tree check).
addopts = "-p no:cacheprovider"

[tool.setuptools.packages.find]
where = ["services/commerce"]
include = ["sellable*"]
