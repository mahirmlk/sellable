name: Temporary Python lock export

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install pinned lock compiler
        run: python -m pip install pip-tools==7.7.0

      - name: Compile runtime and development locks
        run: |
          python -m piptools compile --resolver=backtracking --extra=postgres --generate-hashes --allow-unsafe --output-file=requirements/runtime.txt pyproject.toml
          python -m piptools compile --resolver=backtracking --generate-hashes --allow-unsafe --output-file=requirements/dev.txt requirements/dev.in

      - name: Export locks to the job log
        run: |
          python - <<'PY'
          import base64
          from pathlib import Path

          for name in ("runtime", "dev"):
              encoded = base64.b64encode((Path("requirements") / f"{name}.txt").read_bytes()).decode("ascii")
              print(f"LOCK:{name}:BEGIN")
              for offset in range(0, len(encoded), 8000):
                  print(f"B64:{encoded[offset:offset + 8000]}")
              print(f"LOCK:{name}:END")
          PY
