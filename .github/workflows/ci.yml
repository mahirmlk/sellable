name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Enforce single agent tree
        run: |
          test ! -d services/commerce/agents || (echo "ERROR: duplicate agents tree at services/commerce/agents — only top-level agents/ is canonical" && exit 1)
          python -c "import agents, sellable.agents.buyer, sellable.agents.seller; assert agents.__file__.startswith('agents') or '/agents/__init__' in agents.__file__.replace(chr(92), '/'), agents.__file__; print('agent tree OK:', agents.__file__)"

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short

      - name: Run eval scenarios
        run: python -m evals.runner.scenario_runner
