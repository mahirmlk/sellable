name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Enforce single agent tree
        run: |
          test ! -d services/commerce/agents || (echo "ERROR: duplicate agents tree at services/commerce/agents — only top-level agents/ is canonical" && exit 1)
          python -c "import agents, sellable.agents.buyer, sellable.agents.seller; assert agents.__file__.startswith('agents') or '/agents/__init__' in agents.__file__.replace(chr(92), '/'), agents.__file__; print('agent tree OK:', agents.__file__)"

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short

      - name: Run eval scenarios
        # scenario_runner exits non-zero on any scenario failure (see
        # evals/runner/scenario_runner.py __main__: SystemExit(1 if failed)),
        # so a failing golden scenario fails this job and the build.
        run: python -m evals.runner.scenario_runner

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/merchant-console
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/merchant-console/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint .

      - name: Production build
        run: npm run build

  cloudflare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Verify deployment lockfiles
        run: |
          test -f package.json
          test -f package-lock.json
          git ls-files --error-unmatch package.json package-lock.json
          node -e "const p = require('./package.json'); const l = require('./package-lock.json'); if (l.lockfileVersion < 1 || p.name !== l.name) process.exit(1)"

      - name: Install deployment tooling
        run: npm ci

      - name: Audit deployment dependencies
        run: npm audit --audit-level=high

      - name: Generate Cloudflare environment types
        run: mkdir -p .wrangler && npx wrangler types --path .wrangler/types.d.ts

      - name: Check Worker syntax
        run: node --check cloudflare/worker.js

      - name: Validate Wrangler configuration and bundle
        run: npx wrangler deploy --dry-run
