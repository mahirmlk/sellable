name: Temporary dev lock export

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install pinned lock compiler
        run: python -m pip install pip-tools==7.7.0

      - name: Compile dev lock
        run: python -m piptools compile --resolver=backtracking --generate-hashes --allow-unsafe --output-file=requirements/dev.txt requirements/dev.in

      - name: Export lock to the job log
        run: |
          python - <<'PY'
          import base64
          from pathlib import Path

          encoded = base64.b64encode(Path("requirements/dev.txt").read_bytes()).decode("ascii")
          print("LOCK:dev:BEGIN")
          for offset in range(0, len(encoded), 8000):
              print(f"B64:{encoded[offset:offset + 8000]}")
          print("LOCK:dev:END")
          PY
