services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sellable
      POSTGRES_USER: sellable
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sellable -d sellable"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - sellable_postgres:/var/lib/postgresql/data

volumes:
  sellable_postgres:
